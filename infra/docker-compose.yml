# Violet Code — entorno local / demo.
#   docker compose -f infra/docker-compose.yml up -d db          # solo PostgreSQL (desarrollo con dotnet run)
#   docker compose -f infra/docker-compose.yml up -d --build     # PostgreSQL + API
# Variables: copiar infra/.env.example a infra/.env
name: violet-code

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: violetcode
      POSTGRES_USER: violet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-violet_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U violet -d violetcode"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/core
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Development}
      ConnectionStrings__VioletCode: Host=db;Port=5432;Database=violetcode;Username=violet;Password=${POSTGRES_PASSWORD:-violet_dev_only}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Cors__AdminOrigins__0: http://localhost:5173
      Database__MigrateOnStartup: "true"
      Database__SeedSyntheticData: "true"
      Identity__DemoPassword: ${DEMO_PASSWORD:-Violeta.Demo.2026}
    ports:
      - "5080:8080"

volumes:
  pgdata:
