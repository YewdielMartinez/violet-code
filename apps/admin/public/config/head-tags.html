<!-- Favicons estándar y modernos -->
<link rel="icon" href="/favicons/favicon.ico" sizes="any" />
<link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />

<!-- Apple iOS / Safari -->
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
<link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#7A0C31" />

<!-- PWA / Android / Windows -->
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#7A0C31" />
<meta name="msapplication-TileColor" content="#7A0C31" />
<meta name="msapplication-config" content="/browserconfig.xml" />

<!-- Open Graph / WhatsApp / Facebook / X -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Nombre de tu App" />
<meta property="og:description" content="Descripción breve de tu aplicación web." />
<meta property="og:image" content="/social/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/social/twitter-card.png" />
